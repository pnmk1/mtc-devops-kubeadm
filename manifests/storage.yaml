apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mtc-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mtc-logs
spec:
  capacity:
    storage: 2Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mtc-local
  local:
    path: /var/lib/mtc-devops/logs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: mtc-devops.storage
              operator: In
              values: [local]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mtc-metrics
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mtc-local
  local:
    path: /var/lib/mtc-devops/metrics
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: mtc-devops.storage
              operator: In
              values: [local]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-logs
  namespace: mtc-demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mtc-local
  volumeName: mtc-logs
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: mtc-demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: mtc-local
  volumeName: mtc-metrics
  resources:
    requests:
      storage: 5Gi

