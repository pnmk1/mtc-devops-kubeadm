worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/demo/raw/error.log notice;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type text/plain;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","request_uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';
    access_log /var/log/demo/raw/access.json json;
    sendfile on;
    server {
        listen 8080;
        server_name _;
        location = / { return 200 "Hello World!\n"; }
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / { root /usr/share/nginx/html; log_not_found on; }
    }
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        access_log off;
        location = /stub_status { stub_status; }
        location / { return 404; }
    }
}

