<system>
  log_level info
</system>
<source>
  @type tail
  path /var/log/demo/raw/access.json
  pos_file /var/log/demo/state/access.pos
  tag demo.access
  read_from_head true
  refresh_interval 2
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S%z
    keep_time_key true
  </parse>
</source>
<source>
  @type tail
  path /var/log/demo/raw/error.log
  pos_file /var/log/demo/state/error.pos
  tag demo.error
  read_from_head true
  refresh_interval 2
  <parse>
    @type none
  </parse>
</source>
<match demo.**>
  @type copy
  <store>
    @type stdout
  </store>
  <store>
    @type file
    path /var/log/demo/collected/events.${tag}
    append true
    <inject>
      tag_key source
      time_key collected_at
      time_type string
      time_format %Y-%m-%dT%H:%M:%S%z
    </inject>
    <format>
      @type json
    </format>
    <buffer tag,time>
      @type file
      path /var/log/demo/state/buffer
      timekey 3600
      timekey_wait 1
      timekey_use_utc true
      flush_mode interval
      flush_interval 2s
      flush_at_shutdown true
      chunk_limit_size 1m
      total_limit_size 64m
      overflow_action block
      retry_forever true
    </buffer>
  </store>
</match>

